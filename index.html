  <style>
    @font-face {
      font-family: 'Carl Brown';
      src: url('/assets/CarlBrown.woff2') format('woff2'),
           url('https://cdn.prod.website-files.com/679742110fb07950530154b3/679746d009ffc6f5cca76c84_CarlBrown.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    /* =========================================================
       ANIMATED LANDING PAGE — MADE BY PALLET ROSS INSPIRATION
       Theme: Deep Dark (#08090C, #0C0F15, #10141D) with Neon Cyan & Blue
       ========================================================= */
    :root {
      --ross-bg: #040718;
      --ross-surface: #091026;
      --ross-card: #0c1638;
      --ross-cyan: #38bdf8;
      --ross-mint: #5f86ff;
      --ross-blue: #173ded;
      --ross-blue-glow: #5f86ff;
      --ross-coral: #FF5C35;
      --ross-border: rgba(95, 134, 255, 0.18);
      --ross-border-glow: rgba(95, 134, 255, 0.45);
    }

    .ross-landing-universe {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(6.2rem, 8vw, 8.2rem) clamp(1.2rem, 4vw, 4rem) clamp(3.2rem, 5vw, 4.8rem);
      box-sizing: border-box;
      overflow: hidden;
      background: 
        radial-gradient(ellipse 75% 55% at 50% 20%, rgba(23, 61, 237, 0.18) 0%, rgba(95, 134, 255, 0.08) 45%, transparent 75%),
        radial-gradient(circle at 80% 80%, rgba(23, 61, 237, 0.10) 0%, transparent 60%),
        #040718;
    }

    /* Ambient background radial glow */
    .ross-ambient-glow {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 480px;
      background: radial-gradient(ellipse 65% 50% at 50% 50%, rgba(23, 61, 237, 0.22) 0%, rgba(95, 134, 255, 0.09) 45%, transparent 75%);
      filter: blur(140px);
      pointer-events: none;
      z-index: 0;
    }

    /* Floating mode switcher pill bar */
    .ross-mode-bar {
      position: relative;
      z-index: 25;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 6px;
      border-radius: 999px;
      background: rgba(10, 16, 36, 0.88);
      border: 1px solid rgba(95, 134, 255, 0.22);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 12px 36px rgba(4, 7, 24, 0.8), 0 0 24px rgba(23, 61, 237, 0.2);
      margin-bottom: clamp(1.8rem, 3.2vw, 2.6rem);
    }

    .ross-mode-btn {
      appearance: none;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.65);
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 8px 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .ross-mode-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .ross-mode-btn.is-active {
      color: #FFFFFF;
      background: linear-gradient(135deg, #173ded 0%, #2554ff 100%);
      box-shadow: 0 0 22px rgba(23, 61, 237, 0.7);
      font-weight: 700;
    }

    .ross-mode-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .ross-autocycle-btn {
      appearance: none;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.45);
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 0.68rem;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      margin-left: 4px;
    }

    .ross-autocycle-btn:hover {
      color: #5f86ff;
    }

    .ross-autocycle-btn.is-active {
      color: #5f86ff;
    }

    /* Outer Stage Wrapper */
    .ross-stage-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1380px;
      margin: 0 auto;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ---------------------------------------------------------
       STATE 1: CENTERED MASTERPIECE SHOWCASE
       --------------------------------------------------------- */
    .ross-centered-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      animation: rossFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .ross-badge-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #5f86ff;
      background: rgba(23, 61, 237, 0.14);
      border: 1px solid rgba(95, 134, 255, 0.35);
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 1.2rem;
      box-shadow: 0 0 20px rgba(23, 61, 237, 0.25);
    }

    .ross-headline-monumental {
      font-family: var(--font-display, 'Syne', sans-serif);
      font-size: clamp(2.3rem, 5.8vw, 4.8rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.08;
      color: #FFFFFF;
      max-width: 980px;
      margin: 0 auto;
    }

    .ross-headline-gradient {
      background: linear-gradient(135deg, #FFFFFF 0%, #b8d4ff 50%, #5f86ff 100%); display: inline-block;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ---------------------------------------------------------
       THE FAN OF CARDS CONTAINER
       --------------------------------------------------------- */
    .ross-cards-fan-stage {
      position: relative;
      width: 100%;
      max-width: 920px;
      height: 380px;
      margin: clamp(2.4rem, 4.5vw, 3.5rem) auto clamp(1.8rem, 3.5vw, 2.8rem);
      perspective: 1600px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Floating Persona Badges */
    .ross-floating-badge {
      position: absolute;
      z-index: 35;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 18px;
      border-radius: 999px;
      font-family: var(--font-sans, 'Plus Jakarta Sans', sans-serif);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s;
      user-select: none;
    }

    .ross-floating-badge::after {
      content: '';
      position: absolute;
      width: 0;
      height: 0;
    }

    /* @coplin Blue Tag (Left) */
    .ross-badge-coplin {
      top: 10%;
      left: 17%;
      background: #173ded;
      color: #FFFFFF;
      box-shadow: 0 10px 30px rgba(23, 61, 237, 0.6);
      animation: rossFloatA 3.8s ease-in-out infinite alternate;
    }

    .ross-badge-coplin::after {
      bottom: -6px;
      left: 22px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid #173ded;
    }

    /* @andrea Mint Tag (Right) */
    .ross-badge-andrea {
      top: 14%;
      right: 17%;
      background: #5f86ff;
      color: #FFFFFF;
      box-shadow: 0 10px 30px rgba(95, 134, 255, 0.55);
      animation: rossFloatB 4.2s ease-in-out infinite alternate;
    }

    .ross-badge-andrea::after {
      bottom: -6px;
      right: 22px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid #5f86ff;
    }

    /* @howard Coral Tag (Split state) */
    .ross-badge-howard {
      top: 6%;
      left: 12%;
      background: #FF5C35;
      color: #FFFFFF;
      box-shadow: 0 10px 30px rgba(255, 92, 53, 0.5);
      animation: rossFloatA 3.6s ease-in-out infinite alternate;
    }

    .ross-badge-howard::after {
      bottom: -6px;
      left: 22px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid #FF5C35;
    }

    /* @robin Dark Tag (Split state) */
    .ross-badge-robin {
      top: 10%;
      right: 12%;
      background: #141822;
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
      animation: rossFloatB 4.5s ease-in-out infinite alternate;
    }

    .ross-badge-robin::after {
      bottom: -6px;
      right: 22px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid #141822;
    }

    @keyframes rossFloatA {
      0% { transform: translateY(0px) rotate(-1deg); }
      100% { transform: translateY(-12px) rotate(2deg); }
    }

    @keyframes rossFloatB {
      0% { transform: translateY(-4px) rotate(1deg); }
      100% { transform: translateY(10px) rotate(-2deg); }
    }

    /* Individual Card in the Fan */
    .ross-card-item {
      position: absolute;
      width: clamp(170px, 20vw, 224px);
      height: clamp(235px, 28vw, 305px);
      border-radius: 20px;
      overflow: hidden;
      background: #091026;
      border: 1px solid rgba(95, 134, 255, 0.22);
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(95, 134, 255, 0.08);
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: 50% 125%;
      user-select: none;
    }

    /* Centered Fan Initial Geometry */
    .ross-centered-fan .card-0 {
      transform: translateX(-240px) translateY(24px) rotate(-14deg) scale(0.92);
      z-index: 10;
    }
    .ross-centered-fan .card-1 {
      transform: translateX(-120px) translateY(8px) rotate(-7deg) scale(0.96);
      z-index: 15;
    }
    .ross-centered-fan .card-2 {
      transform: translateX(0px) translateY(0px) rotate(0deg) scale(1.04);
      z-index: 20;
    }
    .ross-centered-fan .card-3 {
      transform: translateX(120px) translateY(8px) rotate(7deg) scale(0.96);
      z-index: 15;
    }
    .ross-centered-fan .card-4 {
      transform: translateX(240px) translateY(24px) rotate(14deg) scale(0.92);
      z-index: 10;
    }

    /* Hover State on Cards */
    .ross-card-item:hover,
    .ross-card-item.is-hovered {
      transform: translateY(-28px) scale(1.12) rotate(0deg) !important;
      z-index: 45 !important;
      border-color: #5f86ff;
      box-shadow: 0 35px 75px rgba(0, 0, 0, 0.9), 0 0 35px rgba(37, 84, 255, 0.6) !important;
    }

    .ross-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .ross-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .ross-card-item:hover .ross-card-img {
      transform: scale(1.06);
    }

    .ross-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0) 45%, rgba(8, 9, 12, 0.88) 100%);
      pointer-events: none;
    }

    .ross-card-meta {
      position: absolute;
      bottom: 0;
      inset-x: 0;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: 2;
    }

    .ross-card-title {
      font-family: var(--font-display, 'Syne', sans-serif);
      font-size: 0.95rem;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.01em;
    }

    .ross-card-category {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 0.68rem;
      color: #00FFD1;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Subtitle & Buttons below cards in Centered Mode */
    .ross-narrative-sub {
      font-family: var(--font-sans, 'Plus Jakarta Sans', sans-serif);
      font-size: clamp(0.95rem, 1.8vw, 1.15rem);
      color: rgba(255, 255, 255, 0.68);
      max-width: 650px;
      margin: 0 auto 1.8rem auto;
      line-height: 1.62;
    }

    .ross-action-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .ross-btn-primary {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #11151E;
      color: #FFFFFF;
      font-family: var(--font-sans, 'Plus Jakarta Sans', sans-serif);
      font-size: 0.92rem;
      font-weight: 700;
      padding: 13px 32px;
      border-radius: 999px;
      border: 1px solid rgba(0, 255, 209, 0.4);
      box-shadow: 0 0 24px rgba(0, 255, 209, 0.25);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .ross-btn-primary:hover {
      background: #00FFD1;
      color: #08090C;
      border-color: #00FFD1;
      box-shadow: 0 0 35px rgba(0, 255, 209, 0.6);
      transform: translateY(-2px);
    }

    .ross-btn-link {
      color: rgba(168, 212, 255, 0.85);
      font-family: var(--font-sans, 'Plus Jakarta Sans', sans-serif);
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 12px 16px;
      transition: color 0.2s, transform 0.2s;
    }

    .ross-btn-link:hover {
      color: #FFFFFF;
      transform: translateX(3px);
    }

    /* ---------------------------------------------------------
       STATE 2: SPLIT E-COMMERCE / MARKETPLACE HERO
       --------------------------------------------------------- */
    .ross-split-hero {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: clamp(2rem, 4vw, 4.5rem);
      align-items: center;
      width: 100%;
      text-align: left;
      animation: rossFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .ross-split-left {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      max-width: 620px;
    }

    .ross-split-headline {
      font-family: var(--font-display, 'Syne', sans-serif);
      font-size: clamp(2.4rem, 5.2vw, 4.4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.06;
      color: #FFFFFF;
    }

    .ross-text-muted {
      color: rgba(255, 255, 255, 0.38);
    }

    .ross-split-narrative {
      font-family: var(--font-sans, 'Plus Jakarta Sans', sans-serif);
      font-size: clamp(0.95rem, 1.6vw, 1.12rem);
      color: rgba(255, 255, 255, 0.68);
      line-height: 1.62;
    }

    /* Right column: Cards fan out in an angled cascade */
    .ross-split-right {
      position: relative;
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1600px;
    }

    .ross-split-fan .card-0 {
      transform: translateX(-140px) translateY(32px) rotate(-12deg) scale(0.90);
      z-index: 10;
    }
    .ross-split-fan .card-1 {
      transform: translateX(-70px) translateY(16px) rotate(-6deg) scale(0.94);
      z-index: 15;
    }
    .ross-split-fan .card-2 {
      transform: translateX(0px) translateY(0px) rotate(0deg) scale(1.02);
      z-index: 20;
    }
    .ross-split-fan .card-3 {
      transform: translateX(70px) translateY(16px) rotate(6deg) scale(0.94);
      z-index: 15;
    }
    .ross-split-fan .card-4 {
      transform: translateX(140px) translateY(32px) rotate(12deg) scale(0.90);
      z-index: 10;
    }

    @keyframes rossFadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0px); }
    }

    /* Responsive Queries */
    @media (max-width: 1024px) {
      .ross-split-hero {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 2.5rem;
      }
      .ross-split-left {
        margin: 0 auto;
        align-items: center;
      }
      .ross-split-fan .card-0 { transform: translateX(-100px) translateY(20px) rotate(-10deg) scale(0.88); }
      .ross-split-fan .card-1 { transform: translateX(-50px) translateY(10px) rotate(-5deg) scale(0.92); }
      .ross-split-fan .card-2 { transform: translateX(0px) translateY(0px) rotate(0deg) scale(1.0); }
      .ross-split-fan .card-3 { transform: translateX(50px) translateY(10px) rotate(5deg) scale(0.92); }
      .ross-split-fan .card-4 { transform: translateX(100px) translateY(20px) rotate(10deg) scale(0.88); }
    }

    @media (max-width: 640px) {
      .ross-landing-universe {
        padding-top: 5.5rem;
        padding-bottom: 2.5rem;
      }
      .ross-cards-fan-stage {
